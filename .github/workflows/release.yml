# Builds a PureTD engine pack for every platform the app runs on.
#
# A pack is what engine-distribution.md describes: a directory named
# <id>/<version>/ holding engine.json, the executable and its weights. The app
# downloads it from gammonbase.com and spawns the executable over BEP; nothing
# here goes into the installer and nothing goes behind the paywall.
#
# The weights are exported once, on Linux, and shared by every platform — they
# are a flat little-endian float32 blob with no architecture in them. Only the
# executable is per-platform, which keeps the matrix cheap and guarantees every
# platform ships the identical network.

name: Build engine packs

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # Must match the site's ObjectStorage config.
  S3_ENDPOINT: https://s3.fr-par.scw.cloud
  S3_BUCKET: gammonbase-assets-prod
  # EngineCatalogueService composes the catalogue from exactly this prefix.
  ENGINES_PREFIX: engines
  ENGINE_ID: puretd
  # The prob5 network: five outputs, which is what the protocol's
  # win/gammon/backgammon fields need. The cubeful model emits one equity
  # scalar and cannot fill them.
  MODEL: cubeless_prob5_512_512_256_128.pt

jobs:
  weights:
    name: Export weights
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PureTD fork
        uses: actions/checkout@v4
        with:
          repository: customation/backgammon-ai-engine
          # Our branch, not the fork's master: master stays a clean mirror of
          # upstream so pulling Alexander's changes is a fast-forward, and our
          # parity gate lives beside it rather than in it.
          ref: customation/parity-gate
          path: puretd

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CPU wheels only. Nothing here ships; this is the one place PyTorch is
      # allowed to exist, and a CUDA build would be gigabytes for no benefit.
      - name: Install the export toolchain
        run: pip install --quiet numpy "torch==2.4.1" --index-url https://download.pytorch.org/whl/cpu

      - name: Export the network
        working-directory: puretd
        run: python export_weights.py "best_models/${MODEL}" "${GITHUB_WORKSPACE}/puretd.bin"

      # The gate: the C forward pass has to agree with the PyTorch one it was
      # exported from. A transposed matrix or a missed activation produces
      # plausible numbers for the wrong network, and this is what catches it.
      - name: Check C and PyTorch agree
        working-directory: puretd/c_inference
        run: |
          gcc -O2 -o parity_check parity_check.c ../c_engine/bg_engine.c nn_eval.c \
              -I../c_engine -lm -Wall
          expected=$(python dump_parity_input.py "../best_models/${MODEL}" parity_input.f32)
          ./parity_check "${GITHUB_WORKSPACE}/puretd.bin" parity_input.f32 "${expected}"

      - uses: actions/upload-artifact@v4
        with:
          name: weights
          path: puretd.bin

  pack:
    name: ${{ matrix.target }}
    needs: weights
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  exe: puretd-engine }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    exe: puretd-engine.exe }
          - { os: macos-latest,   target: aarch64-apple-darwin,      exe: puretd-engine }
          - { os: macos-13,       target: x86_64-apple-darwin,       exe: puretd-engine }
    steps:
      - uses: actions/checkout@v4
        with:
          path: engine

      - name: Check out the PureTD fork
        uses: actions/checkout@v4
        with:
          repository: customation/backgammon-ai-engine
          ref: customation/parity-gate
          path: backgammon-ai-engine

      - name: Check out the protocol
        uses: actions/checkout@v4
        with:
          repository: customation/backgammon-engine-protocol
          path: bep

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        working-directory: engine
        env:
          PURETD_SRC: ${{ github.workspace }}/backgammon-ai-engine
        run: cargo build --release --target ${{ matrix.target }}

      # The board conversion is the other silent failure: a mirrored board is a
      # legal position, so only an assertion against PureTD's own board_init
      # catches it.
      - name: Check the board conversion
        working-directory: engine
        env:
          PURETD_SRC: ${{ github.workspace }}/backgammon-ai-engine
        run: cargo test --release --target ${{ matrix.target }}

      - uses: actions/download-artifact@v4
        with:
          name: weights
          path: engine

      - name: Assemble the pack
        shell: bash
        working-directory: engine
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          pack="pack/${ENGINE_ID}/${version}"
          mkdir -p "${pack}"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "${pack}/"
          cp puretd.bin "${pack}/"
          cat > "${pack}/engine.json" <<JSON
          {
            "id": "${ENGINE_ID}",
            "name": "PureTD",
            "version": "${version}",
            "command": "${{ matrix.exe }}",
            "args": [],
            "instances": 1
          }
          JSON
          ls -l "${pack}"
          du -sh "${pack}"

      # Proof the pack runs, not just that it built: describe over real BEP
      # framing, from the assembled directory, exactly as the app spawns it.
      - name: Check the pack answers the protocol
        if: matrix.os != 'macos-13'
        shell: bash
        working-directory: engine
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          python .github/describe_check.py "pack/${ENGINE_ID}/${version}/${{ matrix.exe }}"

      # The layout gammonbase.com's catalogue reads: identity.json per engine,
      # release.json plus a zip per version and platform. Building it here means
      # publishing is an upload rather than a construction.
      - name: Make the catalogue release
        shell: bash
        working-directory: engine
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          python .github/make_release.py \
            --pack "pack/${ENGINE_ID}/${version}" \
            --out release \
            --id "${ENGINE_ID}" \
            --name "PureTD" \
            --description "Alexander Strehl's self-play network. Cubeless, one forward pass." \
            --licence "MIT" \
            --source-url "https://github.com/customation/puretd-engine" \
            --version "${version}" \
            --target "${{ matrix.target }}" \
            --command "${{ matrix.exe }}"

      - uses: actions/upload-artifact@v4
        with:
          name: puretd-${{ matrix.target }}
          path: engine/release

  publish:
    name: Publish PureTD to object storage
    needs: pack
    runs-on: ubuntu-latest
    # Only from master, and never from a pull request: a fork's PR must not be
    # able to write to the release bucket.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Collect every platform's release
        uses: actions/download-artifact@v4
        with:
          pattern: puretd-*
          path: incoming
          merge-multiple: true

      # Skipped rather than failed when the bucket credentials are absent. The
      # engine repositories that already publish had theirs set by hand, and
      # until this one does the build should still go green and still produce
      # downloadable artifacts — a missing secret is a setup step, not a broken
      # build. It says so loudly in the summary so it cannot be mistaken for
      # having published.
      - name: Publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_OBJECT_STORAGE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_OBJECT_STORAGE_SECRET_KEY }}
          AWS_DEFAULT_REGION: fr-par
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ]; then
            echo "::warning::SCW_OBJECT_STORAGE_ACCESS_KEY is not set on this \
          repository — built but NOT published. Set the same pair \
          sage-engine-server uses to turn this on."
            echo "### Not published" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Object storage credentials are not set on this repository." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          base="s3://${S3_BUCKET}/${ENGINES_PREFIX}/${ENGINE_ID}"
          find incoming -name release.json | while read -r manifest; do
            dir=$(dirname "$manifest")
            version=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$manifest")
            platform=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['platform'])" "$manifest")
            archive=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['file'])" "$manifest")
            target="${base}/${version}/${platform}"

            # ARCHIVE FIRST, MANIFEST SECOND, and the order is the whole of it:
            # the catalogue is composed from release.json, so publishing the
            # manifest before the bytes it names would offer a download that
            #404s for as long as the upload takes.
            aws s3 cp "${dir}/${archive}" "${target}/${archive}" \
              --endpoint-url "${S3_ENDPOINT}" --content-type application/zip
            aws s3 cp "$manifest" "${target}/release.json" \
              --endpoint-url "${S3_ENDPOINT}" --content-type application/json
            echo "published ${ENGINE_ID} ${version} ${platform}"
          done

          # Last, and identical from every platform, so whichever writes it wins
          # and they all agree.
          aws s3 cp "incoming/engines/${ENGINE_ID}/identity.json" \
            "${base}/identity.json" \
            --endpoint-url "${S3_ENDPOINT}" --content-type application/json
